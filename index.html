<style>
:root{--canvas:#ffffff;--panel:#f5f5f7;--ink:#1d1d1f;--soft:#6e6e73;--blue:#0071e3;--err:#c4372c;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--panel);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;letter-spacing:-.02em;-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;padding:24px max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px))}
.card{width:100%;max-width:420px;background:var(--canvas);border-radius:24px;padding:40px 32px 32px;display:flex;flex-direction:column;gap:14px;text-align:center}
h1{margin:0;font-size:2rem;font-weight:600;letter-spacing:-.015em}
p{margin:0;color:var(--soft);line-height:1.45}
form{display:flex;flex-direction:column;gap:10px;margin-top:10px}
label{font-size:.85rem;font-weight:500;text-align:left;color:var(--soft)}
input{font:inherit;font-size:1.15rem;letter-spacing:.12em;text-transform:uppercase;text-align:center;padding:12px 14px;border:1px solid #d2d2d7;border-radius:12px;background:var(--canvas);color:var(--ink)}
input:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:transparent}
button{font:inherit;font-size:1rem;min-height:46px;border:0;border-radius:980px;background:var(--blue);color:#fff;cursor:pointer}
button:hover{background:#0077ed}
button:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
button[disabled]{opacity:.6;cursor:wait}
.msg{min-height:1.3em;font-size:.9rem;color:var(--err)}
.note{font-size:.8rem}
</style>
</head>
<body>
<main class="card">

  <p>This page is private. Enter the access code from my resume to view it.</p>
  <form id="f" autocomplete="off">

    <input id="code" name="code" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX" required>
    <button id="go" type="submit">View page</button>
    <p class="msg" id="msg" role="alert" aria-live="assertive"></p>
  </form>
  <p class="note">No code? Email hudson684@gmail.com.</p>
</main>

  function b64(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
  function norm(c){return String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');}
  async function open(code){
    if(!window.crypto||!crypto.subtle)throw new Error('nocrypto');
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(norm(code)),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c));
    return new TextDecoder().decode(pt);
  }
  function show(html){document.open();document.write(html);document.close();}
  var f=document.getElementById('f'),inp=document.getElementById('code'),btn=document.getElementById('go'),msg=document.getElementById('msg');
  async function tryCode(code,quiet){
    btn.disabled=true;msg.textContent='';
    try{var html=await open(code);try{sessionStorage.setItem('jh-code',norm(code));}catch(e){}show(html);}
    catch(e){btn.disabled=false;if(!quiet)msg.textContent=e.message==='nocrypto'?'This browser can’t open the page. Try a current version of Chrome, Safari, Edge or Firefox.':'That code didn’t work. Check it against your copy of the resume.';inp.focus();}
  }
  f.addEventListener('submit',function(e){e.preventDefault();tryCode(inp.value,false);});
  var fromHash=(location.hash.match(/code=([A-Za-z0-9-]+)/)||[])[1];
  if(fromHash){try{history.replaceState(null,'',location.pathname);}catch(e){}inp.value=fromHash;tryCode(fromHash,false);return;}
  var saved=null;try{saved=sessionStorage.getItem('jh-code');}catch(e){}
  if(saved)tryCode(saved,true);else inp.focus();
